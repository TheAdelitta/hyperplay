name: Deploy to Azure App Service

# Every push to main builds the front end, runs the checks, and deploys the backend with
# the built front end beside it to https://hyperplay.azurewebsites.net. Nothing deploys
# if a check fails.
#
# GitHub signs in to Azure with a short-lived OpenID Connect token; there is no stored
# password. The IDs below are identifiers, not secrets. The managed identity
# "hyperplay-deploy" only trusts tokens from main of TheAdelitta/hyperplay and may only
# deploy to the hyperplay web app. Azure OpenAI settings live in the web app's
# configuration, never in this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: hyperplay
  AZURE_CLIENT_ID: e9494833-0125-4029-b31f-7c00d45b8af1
  AZURE_TENANT_ID: 0d4da0f8-4a31-4d76-ace6-0a62331e1b84
  AZURE_SUBSCRIPTION_ID: 5c1fa54c-9278-4111-a4c6-bcbd1c97aa2a

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject away from
    # refs/heads/main, which is what the Azure federated credential trusts.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build front end
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Check backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest -q

      # App Service installs requirements.txt itself (SCM_DO_BUILD_DURING_DEPLOYMENT).
      - name: Assemble package
        run: |
          mkdir deploy
          cp -r backend/app backend/requirements.txt deploy/
          cp -r contracts deploy/contracts
          cp -r frontend/dist deploy/static

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy

      # A successful deploy did not always switch the running app to the new files, so
      # the previous build kept being served. Restart so the new package is what runs.
      - name: Restart app
        run: az webapp restart --name "$AZURE_WEBAPP_NAME" --resource-group hyperplay-rg

      # Healthy is not enough: the old build is healthy too. Require the live page to
      # reference the exact front-end bundle built in this run.
      - name: Smoke test
        run: |
          expected=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' frontend/dist/index.html | head -1)
          echo "Expecting $expected"
          for i in $(seq 1 40); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' https://hyperplay.azurewebsites.net/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ "$live" = "$expected" ] && curl -fsS https://hyperplay.azurewebsites.net/api/v1/health | grep -q '"aiConfigured":true'; then
              echo "Live on $expected with Azure OpenAI configured"
              exit 0
            fi
            echo "Live bundle: ${live:-none} (attempt $i)"
            sleep 15
          done
          echo "The live site is not serving this build" >&2
          exit 1
